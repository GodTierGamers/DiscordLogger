# Runs the shipped JAR on real Minecraft servers and asserts what Discord receives.
#
# Separate from ci.yml on purpose. This boots servers and takes minutes per version,
# which has no place in the feedback loop of a pull request; CI stays fast and this
# runs nightly, or on demand from the Actions tab.
#
# Free on this repository: it is public, and these are standard runners.
name: Acceptance

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Which versions to run (all, or one of 1.8 / 1.12.2 / 1.16.5 / 26.2)"
        required: false
        default: all
  schedule:
    # 03:20 UTC. Off the hour because everything schedules on the hour and the runner
    # queue is shorter a little after it.
    - cron: "20 3 * * *"

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: ${{ matrix.mc }}
    runs-on: ubuntu-latest
    # Boots several servers and, for 1.8, compiles Spigot from source.
    timeout-minutes: 150
    strategy:
      # Every version reports independently. One failing floor should not hide the
      # results for the other three, which is the whole reason for testing a range.
      fail-fast: false
      matrix:
        include:
          # Paper's oldest build is 1.8.8, so the floor comes from BuildTools.
          - mc: "1.8"
            server_java: "8"
            source: buildtools
          # 1.8.8 as well as 1.8.0: Paper publishes it, so no BuildTools, and its
          # Bukkit is late enough to be past the int-to-double health migration that
          # stops a dynamic proxy implementing Player on early 1.8 builds.
          - mc: "1.8.8"
            server_java: "8"
            source: paper
          - mc: "1.12.2"
            server_java: "8"
            source: paper
          - mc: "1.16.5"
            server_java: "16"
            source: paper
          - mc: "26.2"
            server_java: "25"
            source: paper

    steps:
      - uses: actions/checkout@v7

      - name: Read the build JDK from pom.xml
        id: javaver
        run: echo "version=$(grep -oE '<dl.build.jdk>[0-9]+' pom.xml | grep -oE '[0-9]+')" >> "$GITHUB_OUTPUT"

      # The server's JDK first, then the build's, so JAVA_HOME ends up on the build one
      # while JAVA_HOME_<n>_X64 is exported for both. Jdks.javaBinary reads the latter.
      - name: Install the JDK this Minecraft version needs
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.server_java }}

      - name: Install the build JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.javaver.outputs.version }}
          cache: maven

      - name: Cache server JARs
        uses: actions/cache@v6
        with:
          path: ~/.cache/dl-acceptance
          # Keyed by version so a Spigot build compiled once is not recompiled nightly.
          key: servers-${{ matrix.mc }}-v1

      - name: Build the plugin and the driver
        run: |
          mvn -B -ntp clean package -DskipTests
          mvn -B -ntp -f acceptance/driver/pom.xml clean package

      # Spigot cannot redistribute its JARs, so BuildTools compiles one from source.
      # Ten minutes on a cold cache and nothing on a warm one.
      - name: Build Spigot ${{ matrix.mc }} with BuildTools
        if: matrix.source == 'buildtools'
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_8_X64 }}
        run: |
          set -euo pipefail
          CACHE="$HOME/.cache/dl-acceptance"
          mkdir -p "$CACHE"
          if [ -f "$CACHE/spigot-${{ matrix.mc }}.jar" ]; then
            echo "already built, using the cached JAR"
            exit 0
          fi
          # BuildTools uses git and refuses to run without an identity.
          git config --global user.email "acceptance@example.invalid"
          git config --global user.name "acceptance"
          mkdir -p /tmp/buildtools && cd /tmp/buildtools
          curl -fsSL -o BuildTools.jar \
            https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          "$JAVA_HOME/bin/java" -jar BuildTools.jar --rev ${{ matrix.mc }} --compile SPIGOT
          # BuildTools names the output with the full version; normalise it.
          found=$(ls spigot-*.jar | head -1)
          cp "$found" "$CACHE/spigot-${{ matrix.mc }}.jar"
          ls -lh "$CACHE/spigot-${{ matrix.mc }}.jar"

      - name: Sweep ${{ matrix.mc }}
        run: |
          mvn -B -ntp -f acceptance/pom.xml clean test \
            -DskipTests=false \
            -Ddl.acceptance.version=${{ matrix.mc }} \
            -Ddl.acceptance.results=target/acceptance

      - name: Results and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-${{ matrix.mc }}
          path: |
            acceptance/target/acceptance/**
          if-no-files-found: warn
          retention-days: 30

      - name: Server log on failure
        if: failure()
        run: |
          echo "::group::surefire reports"
          find acceptance/target/surefire-reports -name "*.txt" -exec tail -60 {} + || true
          echo "::endgroup::"

  # ----------------------------------------------------------------------------------
  # One place to read what the whole sweep found, and a history of what it used to find
  # ----------------------------------------------------------------------------------
  report:
    name: report
    needs: sweep
    # Runs even when a version went red. A run where the 1.8 floor broke is exactly
    # the run worth recording; skipping the report on failure would keep the history
    # clean by throwing away every interesting entry in it.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the scripts
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Collect every version's results
        uses: actions/download-artifact@v8
        with:
          pattern: acceptance-*
          path: artifacts

      - name: Read the plugin version
        id: ver
        run: |
          echo "value=$(grep -m1 -oE '<version>[^<]+' pom.xml | head -1 | sed 's/<version>//')" >> "$GITHUB_OUTPUT"

      # Same store, same reasoning as poll-metrics.yml: branch protection rejects a
      # direct push to main, so a workflow that wrote there would fail every run.
      - name: Fetch the store, or start it
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" "$BRANCH" >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch "$BRANCH" "$REMOTE" store
          else
            echo "No $BRANCH yet — starting one."
            mkdir store
            git -C store init --quiet
            git -C store checkout --quiet -b "$BRANCH"
            git -C store remote add origin "$REMOTE"
            cp .github/metrics-store.md store/README.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: metrics-data

      - name: Append this run
        run: |
          python3 scripts/collect-acceptance.py \
            --artifacts artifacts \
            --store store \
            --run-id "${{ github.run_id }}" \
            --plugin-version "${{ steps.ver.outputs.value }}"

      - name: Refresh the store's README
        run: cp .github/metrics-store.md store/README.md

      - name: Commit the results
        run: |
          set -euo pipefail
          cd store
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit --quiet -m "chore(acceptance): results for run ${{ github.run_id }}"
          git push --quiet origin metrics-data
          echo "Pushed to metrics-data."
        env:
          BRANCH: metrics-data

      - name: Summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv, pathlib, collections
          rows = []
          for f in sorted(pathlib.Path("artifacts").rglob("results.csv")):
              with f.open(newline="", encoding="utf-8") as fh:
                  rows += [r for r in csv.DictReader(fh) if r.get("key")]
          if not rows:
              print("No results were produced.")
              raise SystemExit
          versions = sorted({r["version"] for r in rows})
          order = ["PASS", "PROBABLY_FINE", "POTENTIAL_ERROR", "WRONG"]
          print("## Acceptance\n")
          print("| Version | " + " | ".join(order) + " | total |")
          print("|---|" + "---|" * (len(order) + 1))
          for v in versions:
              mine = [r for r in rows if r["version"] == v]
              tally = collections.Counter(r["verdict"] for r in mine)
              print(f"| {v} | " + " | ".join(str(tally.get(o, 0)) for o in order)
                    + f" | {len(mine)} |")
          bad = [r for r in rows if r["verdict"] in ("WRONG", "POTENTIAL_ERROR")]
          if bad:
              print("\n### Needing a look\n")
              for r in sorted(bad, key=lambda r: (r["verdict"], r["key"]))[:60]:
                  detail = " ".join(r["detail"].split())[:160]
                  print(f"- `{r['version']}` **{r['verdict']}** `{r['key']}` — {detail}")
          EOF
