name: Release Build

# Fires when release-please publishes a GitHub Release (i.e. its Release PR was
# merged). Nightly releases are created directly by nightly.yml via the API,
# which ALSO fires this "release: published" event -- the tag-name guard below
# is what keeps this workflow from double-processing them.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.release.tag_name, '-BETA.') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Stamp build date into config.yml trailer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, datetime

          path = "src/main/resources/config.yml"
          built = datetime.datetime.utcnow().strftime("%d-%m-%Y")

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Trailer already contains the correct released version (release-please
          # rewrote it in the merged Release PR) -- we only append the build date.
          # The optional BUILT/annotation suffixes are consumed too so this stays
          # idempotent if it's ever run more than once against the same checkout.
          pattern = re.compile(
              r"(CONFIG VERSION V\d+, SHIPPED WITH v[0-9][^\s(]*)"
              r"(?:\s+BUILT\s+\S+)?(?:\s*\([^)]*\))?"
          )

          def repl(m):
              return f"{m.group(1)} BUILT {built}"

          new_text, n = pattern.subn(repl, text, count=1)
          if n == 0:
              raise SystemExit("Could not find CONFIG VERSION trailer in " + path)

          with open(path, "w", encoding="utf-8") as f:
              f.write(new_text)

          print(f"Stamped build date {built} into {path}")
          PY

      - name: Build (skip tests for speed)
        run: |
          mvn -B -ntp -DskipTests \
            -Ddl.build.channel=stable \
            -Ddl.build.date=$(date -u +%d-%m-%Y) \
            clean package

      - name: Locate & rename artifact
        id: jar
        run: |
          set -euo pipefail
          src="$(ls -1 target/*.jar | grep -v -E 'sources|javadoc|original' | head -n1)"
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          dest="target/DiscordLogger-v${version}.jar"
          cp "$src" "$dest"
          echo "file=$dest" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 checksum
        id: checksum
        run: |
          set -euo pipefail
          sha256sum "${{ steps.jar.outputs.file }}" > "${{ steps.jar.outputs.file }}.sha256"
          echo "file=${{ steps.jar.outputs.file }}.sha256" >> "$GITHUB_OUTPUT"

      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            ${{ steps.jar.outputs.file }}
            ${{ steps.checksum.outputs.file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
