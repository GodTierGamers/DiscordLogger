name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.filter.outputs.java }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            java:
              - 'src/**'
              - 'pom.xml'
            docs:
              - 'docs/assets/configs/**'
              - 'scripts/validate-config-generator.py'

  build:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Java version from pom.xml
        id: javaver
        run: echo "version=$(grep -oE '<dl.build.jdk>[0-9]+' pom.xml | grep -oE '[0-9]+')" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.javaver.outputs.version }}
          cache: maven

      - name: Build with Maven (tests on)
        run: mvn -B -ntp clean package

      - name: Upload PR artifact (jar)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: discordlogger-pr-build
          path: |
            target/*.jar
            !target/*-sources.jar
            !target/*-javadoc.jar

  compat-floor:
    # Proves the plugin compiles against the OLDEST server that can load it.
    #
    # api-version cannot express a patch version before 1.20.5, so declaring
    # "1.19" admits 1.19.0 onward — but the test suite only runs from 1.19.4, and
    # the main build compiles against that. Without this job, using an API added
    # in 1.19.1+ would compile, test, ship, and then NoSuchMethodError on the
    # 1.19.0 servers the listings advertise. Compiling against the floor is what
    # makes that advertisement a checked claim rather than an assumption.
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Java version from pom.xml
        id: javaver
        run: echo "version=$(grep -oE '<dl.build.jdk>[0-9]+' pom.xml | grep -oE '[0-9]+')" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.javaver.outputs.version }}
          cache: maven

      - name: Read the compat floor from pom.xml
        id: floor
        run: echo "version=$(grep -oE '<dl.compat.floor>[^<]+' pom.xml | cut -d'>' -f2)" >> "$GITHUB_OUTPUT"

      - name: Compile against the oldest supported API
        run: mvn -B -ntp clean compile -Dspigot.api.version=${{ steps.floor.outputs.version }}

  validate-generator-data:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate config generator data
        run: python3 scripts/validate-config-generator.py
