name: Release Please

# Runs on every push to main. Maintains the rolling Release PR; when that PR
# is merged, the same run creates the tag + GitHub Release AND builds/attaches
# the stable JAR. The build lives in this workflow (not a `release: published`
# listener) deliberately: events created with the built-in GITHUB_TOKEN do not
# trigger other workflows, so a separate release-triggered workflow would
# never fire for release-please's releases.

on:
  push:
    branches: [main]

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-artifact:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        env:
          TAG_OUTPUT: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAG="${TAG_OUTPUT:-}"
          if [ -z "$TAG" ]; then
            # Fallback: newest stable tag (release-please just pushed it)
            TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -Ev -- '-BETA\.' | sort -V | tail -n1)"
          fi
          [ -n "$TAG" ] || { echo "Could not resolve release tag"; exit 1; }
          echo "Building release artifact for $TAG"
          git checkout "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Read Java version from pom.xml
        id: javaver
        run: echo "version=$(grep -oE '<maven.compiler.release>[0-9]+' pom.xml | grep -oE '[0-9]+')" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.javaver.outputs.version }}
          cache: maven

      - name: Stamp build date into the config trailers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, datetime

          # Every config file the plugin ships carries the same trailer, so every
          # one has to be stamped. Missing lang.yml left it claiming the source
          # version, with the release-please marker still in it, in a file users open.
          paths = [
              "src/main/resources/config.yml",
              "src/main/resources/lang.yml",
          ]
          built = datetime.datetime.utcnow().strftime("%d-%m-%Y")

          # Trailer already contains the correct released version (release-please
          # rewrote it in the merged Release PR) -- we only append the build date.
          # The optional BUILT/annotation suffixes are consumed too so this stays
          # idempotent if it's ever run more than once against the same checkout.
          pattern = re.compile(
              r"(CONFIG VERSION V\d+, SHIPPED WITH v[0-9][^\s(]*)"
              r"(?:\s+BUILT\s+\S+)?(?:\s*\([^)]*\))?"
          )

          def repl(m):
              return f"{m.group(1)} BUILT {built}"

          for path in paths:
              with open(path, "r", encoding="utf-8") as f:
                  text = f.read()

              new_text, n = pattern.subn(repl, text, count=1)
              if n == 0:
                  raise SystemExit("Could not find CONFIG VERSION trailer in " + path)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(new_text)

              print(f"Stamped build date {built} into {path}")
          PY

      - name: Build (skip tests for speed)
        run: |
          mvn -B -ntp -DskipTests \
            -Ddl.build.channel=stable \
            -Ddl.build.date=$(date -u +%d-%m-%Y) \
            clean package

      - name: Rename artifact + checksum
        id: jar
        run: |
          set -euo pipefail
          src="$(ls -1 target/*.jar | grep -v -E 'sources|javadoc|original' | head -n1)"
          version="${{ steps.tag.outputs.tag }}"
          version="${version#v}"
          dest="target/DiscordLogger-v${version}.jar"
          cp "$src" "$dest"
          sha256sum "$dest" > "${dest}.sha256"
          echo "file=$dest" >> "$GITHUB_OUTPUT"

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.tag.outputs.tag }}" \
            "${{ steps.jar.outputs.file }}" \
            "${{ steps.jar.outputs.file }}.sha256" \
            --clobber

  # Mirrors the stable release onto the Modrinth and Hangar listings, which is
  # where most server owners actually look. Runs after build-artifact so the JAR
  # is already attached to the GitHub Release: Hangar links straight to that
  # asset, so its downloads land on GitHub's counter.
  publish-listings:
    needs: [release-please, build-artifact]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Download the released JAR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p target
          gh release download "$TAG" --pattern '*.jar' --dir target
          ls -l target

      - name: Publish to Modrinth and Hangar
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          HANGAR_API_KEY: ${{ secrets.HANGAR_API_KEY }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          jar="$(ls -1 target/*.jar | head -n1)"
          python3 scripts/publish-listings.py --jar "$jar" --tag "$TAG"

      - name: Commit the refreshed downloads badge
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/assets/badges/downloads.json; then
            echo "Badge unchanged."
            exit 0
          fi
          git add docs/assets/badges/downloads.json
          git commit -m "chore: refresh downloads badge [skip ci]"
          git push origin main
