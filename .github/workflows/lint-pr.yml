name: Lint PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

concurrency:
  group: lint-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            ci
            build
            perf
            style
            revert
          requireScope: false
          # release-please's own PR titles ("chore: release X.Y.Z") already
          # match the pattern, no extra allowance needed.
