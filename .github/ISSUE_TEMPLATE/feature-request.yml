name: "Feature request"
description: "Propose a new capability or improvement"
title: "[Feature]: <short summary>"
labels: ["feat"]
assignees: []
body:
  - type: markdown
    attributes:
      value: "Tell us what problem this solves and how it should work."

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: "What's the pain point for server admins/players?"
      render: markdown
      placeholder: |
        When staff ban or kick players, we need an audit log showing who executed it and why.

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: "Describe behavior, messages, and any toggles."
      render: markdown
      placeholder: |
        - Add `log.moderation.mute` toggle
        - Embed shows: muted player, duration, reason, and who executed it
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      render: markdown
      placeholder: |
        - Parsing console logs (brittle)
        - External moderation plugin hooks (adds dependency)

  - type: textarea
    id: impacts
    attributes:
      label: Config & compatibility impacts
      render: markdown
      placeholder: |
        - New config keys (defaults): `log.moderation.mute: true`
        - Backward compatible: yes (config auto-migrates)
        - Permission nodes: none
        - Config generator: new toggle in the events step

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      render: markdown
      placeholder: |
        - [ ] Logged when a player is muted/unmuted
        - [ ] Shows executor and target
        - [ ] Respects config toggle
        - [ ] Works from both in-game and console commands

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Nice to have
        - Important
        - Urgent
      default: 0
