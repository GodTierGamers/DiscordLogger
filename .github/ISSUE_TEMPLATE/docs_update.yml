name: "Docs update"
description: "Fix or improve documentation (website or repo docs)"
title: "[Docs]: <topic>"
labels: ["docs"]
assignees: []
body:
  - type: textarea
    id: scope
    attributes:
      label: Pages to update
      render: markdown
      placeholder: |
        - docs/config/v9/index.md (config reference)
        - docs/setup/index.md (setup guide)
        - README.md

  - type: textarea
    id: change
    attributes:
      label: What should change?
      render: markdown
      placeholder: |
        - Add examples for `log.player.advancement`
        - Clarify the `format.time` pattern syntax

  - type: textarea
    id: snippets
    attributes:
      label: Snippets / examples (optional)
      render: markdown
