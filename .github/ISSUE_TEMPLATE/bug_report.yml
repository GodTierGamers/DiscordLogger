name: "Bug report"
description: "Something isn't working as expected"
title: "[Bug]: <short summary>"
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug for **DiscordLogger**. Please fill in the details below.

  - type: checkboxes
    id: prechecks
    attributes:
      label: Pre-checks
      options:
        - label: I searched existing issues and PRs for duplicates
          required: true
        - label: I'm on the latest build of my channel (latest stable release, or latest nightly if on the beta channel)
          required: true
        - label: I can reproduce on a clean server with only this plugin installed
          required: false

  - type: dropdown
    id: channel
    attributes:
      label: Release channel
      description: "Nightly builds show a version like 2.3.0-BETA.4 and warn in console on startup."
      options:
        - Stable release
        - Nightly (BETA pre-release)
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Server platform
      description: "DiscordLogger requires Paper or a Paper fork."
      options:
        - Paper
        - Purpur
        - Other Paper fork
    validations:
      required: true

  - type: input
    id: mcversion
    attributes:
      label: Minecraft version
      placeholder: "e.g., 1.21.8"
    validations:
      required: true

  - type: input
    id: pluginver
    attributes:
      label: DiscordLogger version (exact)
      description: "From the console startup log or the JAR name. For nightlies include the full BETA number."
      placeholder: "e.g., 2.2.0 or 2.3.0-BETA.4"
    validations:
      required: true

  - type: input
    id: javaver
    attributes:
      label: Java version
      placeholder: "e.g., 21 (Temurin)"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "Number each step. Be exact."
      placeholder: |
        1) Start server with DiscordLogger
        2) Run /op TestUser
        3) Observe webhook…
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      render: markdown
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      render: markdown
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / stack traces
      description: "Paste the smallest log that reproduces the issue. Redact webhook URLs and other secrets."
      render: shell
      placeholder: |
        [Server.log excerpt or stack trace]
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Related config.yml snippet (optional)
      description: "Redact webhook URLs/tokens."
      render: yaml
      placeholder: |
        log:
          moderation:
            op: true
    validations:
      required: false

  - type: checkboxes
    id: severity
    attributes:
      label: Severity
      options:
        - label: Blocks server start
        - label: Breaks a major feature
        - label: Minor/visual issue

  - type: textarea
    id: notes
    attributes:
      label: Additional context / screenshots (optional)
      render: markdown
