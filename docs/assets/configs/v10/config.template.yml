#############################
# D O C U M E N T A T I O N #
#############################

# Documentation for this config can be found at https://discordlogger.godtiergamers.xyz/config/v10/

#########################
# D O   N O T   E D I T #
#########################

# Identifies which config format this file uses, so the plugin can upgrade it
# correctly when you update. Changing it will not convert anything -- it only
# misleads the upgrader. If it goes missing the plugin works it out from the keys
# below, so deleting it is survivable, just unnecessary.
# Set automatically
config-version: 10

###################
# WEBHOOK OPTIONS #
###################

webhook:
  url: "{{WEBHOOK_URL}}" # Discord webhook URL goes here, plugin will not function until present

##################
# FORMAT OPTIONS #
##################

format:
  # ONLY USED FOR PLAIN TEXT MESSAGES (EMBEDS DISABLED)
  # Usage (case-sensitive): HH=hours, mm=minutes, ss=seconds, dd=day, MM=month, yyyy=year
  time: "{{TIME_FORMAT}}"
  # Only used for plain text, for embeds edit author name
  name: "{{PLAIN_NAME}}"
  # Show nicknames (if set) as "Nickname (RealName)" in all player-related logs
  nicknames: {{NICKNAMES}}

#################
# EMBED OPTIONS #
#################

embeds:
  enabled: {{EMBEDS_ENABLED}}
  author: "{{EMBEDS_AUTHOR}}" # Can be modified for proxy servers (e.g. Survival, Creative)

