name: DiscordLogger
main: com.discordlogger.DiscordLogger
version: ${project.version}
api-version: ${dl.api.version}
author: LVCHLANN
description: Logs server events to a Discord channel via webhooks.

# Optional. Paper gives each plugin its own classloader, so without naming
# Floodgate here, Class.forName for its API fails even when it IS installed --
# and Bedrock detection silently drops to the undocumented UUID fallback.
# softdepend, not depend: the plugin runs perfectly well without it.
softdepend: [floodgate, Geyser-Spigot]

commands:
  discordlogger:
    description: DiscordLogger reload command
    usage: "/discordlogger <reload|webhook|regen|status|test|doctor>"
    aliases: [dlogger, dlog]

permissions:
  discordlogger.reload:
    description: Allows reloading DiscordLogger config
    default: op
  discordlogger.webhook:
    description: Allows setting the Discord webhook URL in-game
    default: op
  discordlogger.regen:
    description: Allows rebuilding config.yml from the version bundled with this build
    default: op
  discordlogger.status:
    description: Allows viewing queue, webhook and build health
    default: op
  discordlogger.test:
    description: Allows sending a test message to a category's webhook
    default: op
  discordlogger.doctor:
    description: Allows checking the config for contradictions
    default: op